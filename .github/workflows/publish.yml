name: Post a Reel

# One Reel a day (Mackenzie asked, Sam agreed, Oct 13 2026): 8:30pm Pacific in
# daylight time (7:30pm in winter), when people wind down. GitHub can start
# scheduled runs by about FIVE hours (Oct 14 and 15: runs set for 8:30pm started
# near 1:30am and the overnight guard blocked them). So four runs are set earlier,
# at 1:30, 3:30, 5:30 and 7:30pm Pacific in daylight time: a typical delay then lands
# in the evening, and publish.mjs keeps 18 hours between Reels, so only one posts.
# Live since Oct 13 2026 (Sam: start posting).
#
# Run by hand with mode "burst" to post several, spaced out (the launch post
# the first 10 about 35 minutes apart: never many in one hour, which is what
# got the LuxyBasement app blocked).
on:
  schedule:
    - cron: '30 20 * * *'
    - cron: '30 22 * * *'
    - cron: '30 0 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = report only; publish = post the next Reel now; burst = post several, spaced out'
        type: choice
        options: [check, publish, burst]
        default: check
      count:
        description: 'burst: how many Reels'
        default: '10'
      spacing:
        description: 'burst: minutes between Reels (30 at least)'
        default: '35'
      anytime:
        description: 'burst: also post between 11pm and 7am Pacific'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stop if blocked
        id: gate
        run: |
          if [ -f blocked.txt ]; then
            echo "blocked.txt exists, so nothing posts until a person removes it:"; cat blocked.txt
            echo "stop=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Post
        if: steps.gate.outputs.stop != '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'publish' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
          SPACING: ${{ github.event.inputs.spacing || '35' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$INPUT_MODE" = burst ]; then
            n=$COUNT; gap=$SPACING; [ "$gap" -lt 30 ] && gap=30
            export MODE=publish MIN_GAP_HOURS=0
            [ "${{ github.event.inputs.anytime }}" = true ] && export ALLOW_NIGHT=1
          else
            n=1; gap=0; export MODE=$INPUT_MODE
          fi
          rc=0
          for i in $(seq 1 "$n"); do
            rc=0; node publish.mjs || rc=$?
            if [ "$rc" = 76 ]; then
              printf 'Instagram refused on %s (token expired, or Meta restricted the app). Renew the token, then delete this file.\n' "$(date -u +%FT%TZ)" > blocked.txt
              git add blocked.txt
            fi
            [ -f published.json ] && git add published.json
            if ! git diff --cached --quiet; then
              git commit -qm "Record Reel"
              git pull -q --rebase
              git push -q
            fi
            # Stop the burst on a block, a quota pause or a failure.
            [ "$rc" = 0 ] || break
            [ "$i" -lt "$n" ] && sleep $((gap * 60))
          done
          [ "$rc" = 75 ] && rc=0
          exit $rc
